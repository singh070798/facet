<h1>Facet documentation</h1>
<p class="lead">Facet is a local, no-code editor for real-time WebGL scenes: stack shapes, text, images, video, 3D models and shader effects, make them react to the mouse, and export the result to run on any website. Everything happens in your browser — nothing is uploaded anywhere.</p>

<!-- ============================================================ -->
<h2 id="start">Getting started</h2>
<ol>
  <li><b>Open <code>facet.html</code></b> in a current desktop browser — Chrome or Edge work best; Firefox and Safari also work. Just double-click the file; no install, server or internet connection is needed.</li>
  <li>Facet opens with the <b>Aurora hero</b> template. Move your mouse over the preview to see the interactive effects.</li>
  <li>Choose <b>New</b> in the top bar to start from another template or a blank scene.</li>
  <li>Add things with the <b>Add</b> buttons on the left (Shape, Text, Image, Video, 3D, Effect), select a layer, and adjust it in the panel on the right.</li>
  <li>When you’re done, use <b>Export</b> to get a web page, an embed for your site, an image or a video.</li>
</ol>
<div class="note"><b>Requirements:</b> a browser with WebGL2 and hardware acceleration turned on. If Facet says WebGL2 isn’t available, see <a href="#troubleshooting">Troubleshooting</a>.</div>

<h3>Templates</h3>
<div class="grid2">
  <div class="card"><b>Aurora hero</b><span>Drifting mesh gradient, headline, mouse trail, grain.</span></div>
  <div class="card"><b>Liquid type</b><span>Big word warped by liquid distortion with bloom.</span></div>
  <div class="card"><b>Retro dither</b><span>Noise field, 2-colour dithering and a CRT screen.</span></div>
  <div class="card"><b>Ribbed glass</b><span>Soft blobs with parallax seen through fluted glass.</span></div>
  <div class="card"><b>ASCII terminal</b><span>Gradient and swirl rebuilt from text characters.</span></div>
  <div class="card"><b>Masked type</b><span>Gradient, lines and liquid clipped to a word with a mask.</span></div>
  <div class="card"><b>Fluid ink</b><span>A fluid simulation you stir with the mouse; letter spacing follows mouse X.</span></div>
  <div class="card"><b>Particle type</b><span>A word made of 65,000 particles that blow apart the faster you move.</span></div>
  <div class="card"><b>Card flip</b><span>A card that pops in, rocks in 3D and tilts with the mouse — Transform + animation + a mask inside a nested group.</span></div>
  <div class="card"><b>Warp grid</b><span>A spacetime grid and a word bent by a gravity lens on the cursor; hold to add mass.</span></div>
  <div class="card"><b>Gargantua</b><span>The Gravity lens pushed to the extreme: a ray-traced black hole bending a starfield. Move to orbit, hold to fall closer.</span></div>
  <div class="card"><b>Chrome object</b><span>A reflective 3D torus knot that tilts toward the mouse.</span></div>
  <div class="card"><b>Video backdrop</b><span>An empty video slot with colour grading and halftone — drop in a clip.</span></div>
  <div class="card"><b>Blank</b><span>Just a gradient background.</span></div>
</div>
<div class="warn">Choosing a template replaces the current scene, and undo can’t bring it back. <b>Save</b> first if you want to keep it.</div>

<!-- ============================================================ -->
<h2 id="interface">The interface</h2>
<table>
  <tr><th>Area</th><th>What it does</th></tr>
  <tr><td><b>Top bar</b></td><td>Project name · Undo / Redo · Restart animation · Play / Pause · frame rate · <b>New</b> (templates) · <b>Open</b> a project file · <b>Save</b> a project file · <b>Export</b> · <b>Help</b> (this document).</td></tr>
  <tr><td><b>Add</b> (left, top)</td><td>Buttons to add a Shape, Text, Image, Video, 3D model or Effect. New layers go just above the selected layer — or inside it, if a group is selected.</td></tr>
  <tr><td><b>Layers</b> (left)</td><td>The layer tree. Top of the list draws on top. Eye icon shows/hides, double-click renames, hover for duplicate/delete, drag to reorder or into groups. The small buttons in the header group, mask and ungroup the selection.</td></tr>
  <tr><td><b>Canvas</b> (centre)</td><td>Live preview of the design frame. Click to select, drag to move, use the corner handle to resize. The bottom-left shows the frame size and zoom.</td></tr>
  <tr><td><b>Inspector</b> (right)</td><td>Settings for the selected layer. With nothing selected it shows scene settings (size, mouse smoothing, fonts) and the shortcut list. <b>Double-click any setting’s label to reset it</b> to its default.</td></tr>
</table>

<!-- ============================================================ -->
<h2 id="layers">Layers</h2>
<p>A scene is a stack of layers drawn from the bottom up. There are two families:</p>
<ul>
  <li><b>Content layers</b> — shapes, text, images, video and 3D models — draw something.</li>
  <li><b>Effect layers</b> change, or paint over, <i>everything below them</i> in the same group (or the whole scene, if they’re at the top level).</li>
</ul>
<p>Every layer except the background has <b>Opacity</b> and a <b>Blend</b> mode: Normal, Multiply, Screen, Overlay, Add, Difference, Soft light, Darken, Lighten, Color dodge. The light-adding modes (Screen, Add, Lighten, Color dodge) only add light: where nothing is below them — for example inside a group — their dark parts stay transparent, so a Screen-blended starfield in a group shows just its stars.</p>

<h3 id="background">Background</h3>
<p>Always the bottom layer of the scene and can’t be deleted or moved. <b>Fill</b>: Solid, Linear gradient (with angle) or Radial gradient, with one or two colours.</p>

<h3 id="shape">Shape</h3>
<table>
  <tr><th>Setting</th><th>Notes</th></tr>
  <tr><td>Type</td><td>Ellipse, Rectangle, Polygon or Star — or <b>Vector from SVG file…</b> in the Shape menu (see below).</td></tr>
  <tr><td>Fill</td><td><b>Solid colour</b>, <b>Linear gradient</b> (two colours and an angle), <b>Radial gradient</b> (two colours and a size) or <b>None</b> for an outline only.</td></tr>
  <tr><td>Outline, Outline colour</td><td>A stroke around the shape, in design pixels (0 = none).</td></tr>
  <tr><td>Width, Height</td><td>Sizes are in design-frame pixels.</td></tr>
  <tr><td>Corner radius</td><td>Rectangles only.</td></tr>
  <tr><td>Sides / Points, Inner radius</td><td>Polygons (3–16 sides) and stars (points and how deep the inner corners go).</td></tr>
</table>
<h4>Vector shapes from SVG</h4>
<p><b>Shape → Vector from SVG file…</b> turns an SVG into a real vector shape instead of a picture: every path, rectangle, circle, polygon and line is read, with transforms, fill rules, strokes and colours kept. It stays sharp at any size and can be resized, rotated, animated, masked and extruded like any shape. <b>SVG colours</b> on keeps the file’s colours; off paints the whole vector with the shape’s own fill (solid or gradient). Gradients inside the SVG become their first colour; text in an SVG should be converted to outlines first. (Dropping or adding an SVG as an <i>image</i> still works — use that when you want it as a flat picture.)</p>

<h3 id="text">Text</h3>
<table>
  <tr><th>Setting</th><th>Notes</th></tr>
  <tr><td>Content</td><td>Multi-line; press Enter for a new line. Double-click text on the canvas to jump to this box.</td></tr>
  <tr><td>Font</td><td>System Sans, Helvetica, Georgia, Times, Mono, Impact, Trebuchet, Courier — or <b>Upload font file…</b> (.ttf, .otf, .woff, .woff2).</td></tr>
  <tr><td>Size, Weight, Width, Italic, Align</td><td>Size 6–900 px. <b>Weight</b> is any value 1–1000: variable fonts show every step, so it can be animated or mouse-driven smoothly; other fonts use their nearest weight. <b>Width</b> 50–200 % (condensed ↔ expanded) works with fonts that have width styles, in the nine standard steps.</td></tr>
  <tr><td>Line height, Letter spacing, Colour</td><td>Letter spacing can be negative for tight headlines.</td></tr>
</table>
<div class="warn"><b>Fonts on other computers:</b> the built-in choices use fonts installed on the viewer’s device, so text can look slightly different elsewhere. For an exact look, upload the font file — it’s embedded in the project and in every export. Check the font’s licence allows web embedding.</div>

<h3 id="image">Image</h3>
<p>Add with the Image button or by dropping a file onto the canvas. <b>Fit</b>: <i>Free size</i> (set a width), <i>Cover frame</i> (fills the frame, cropping) or <i>Contain in frame</i> (whole image visible).</p>

<h3 id="video">Video</h3>
<p>Add with the Video button or by dropping a file. Videos always play <b>muted</b> and <b>loop</b> (browsers only allow muted videos to autoplay). Settings: <b>Fit</b> (cover, contain or free), <b>Width</b> (free size), <b>Playback speed</b> (0.1–4×). Play/Pause and Restart in the top bar control videos too.</p>
<p>If a template has an empty video slot, a video you add fills that slot instead of creating a new layer.</p>
<div class="note">Use <b>MP4 (H.264)</b> or <b>WebM</b>. QuickTime <code>.mov</code> files often won’t play in Chrome or Firefox. Short, compressed clips are best — the video is embedded in your exports.</div>

<h3 id="model">3D</h3>
<p>The 3D button offers built-in shapes — <b>Torus knot, Sphere, Torus, Cube, Icosahedron</b> — and <b>Upload model…</b> for your own <code>.glb</code>, <code>.gltf</code> (single file), <code>.obj</code> or <code>.stl</code>.</p>
<h4>Look</h4>
<table>
  <tr><th>Setting</th><th>Notes</th></tr>
  <tr><td>Shading</td><td><b>Standard</b> (lit, with reflections) · <b>Chrome</b> (mirror-like) · <b>Toon</b> (banded) · <b>Normals</b> (rainbow by surface direction) · <b>Flat colour</b> (a silhouette — useful as a mask).</td></tr>
  <tr><td>File materials</td><td>glTF/GLB only: use the colours and textures stored in the file. Turn off to use your own colour.</td></tr>
  <tr><td>Colour, Metalness, Roughness</td><td>For built-in shapes, OBJ/STL files, or when file materials are off.</td></tr>
  <tr><td>Toon steps</td><td>Number of shading bands in Toon mode.</td></tr>
</table>
<h4>Lighting</h4>
<p><b>Light direction</b> and <b>Light height</b> aim the main light; <b>Light strength</b> and <b>Ambient</b> set brightness; <b>Rim light</b> and <b>Rim colour</b> add a glowing edge; <b>Sky reflection</b> and <b>Floor reflection</b> are the colours of the built-in studio environment seen in reflections.</p>
<h4>Transform &amp; motion</h4>
<p><b>Size</b> is the model’s radius in pixels. <b>Rotate X/Y/Z</b> set its resting angle, <b>Perspective</b> is the camera’s field of view (low = flat, high = dramatic). <b>Spin</b> turns it continuously (degrees per second), <b>Mouse tilt</b> makes it turn toward the cursor, and <b>Wobble</b> / <b>Wobble detail</b> add an organic, moving surface.</p>
<div class="note">Each 3D layer is rendered on its own and then composited like a flat layer, so two models can’t pass through each other in depth — one simply draws on top. Animations and rigging stored in files aren’t played. STL files are often “Z-up”; Facet rotates them −90° on X when added.</div>

<h3 id="effect-layers">Effects</h3>
<p>Click <b>Effect</b> to open the picker (searchable, with live previews). There are four families:</p>
<ul>
  <li><b>Fills</b> generate an image of their own and paint it over what’s below. Mix them in with opacity or a blend mode.</li>
  <li><b>Distort</b> effects move pixels around (liquid, ripples, glass…).</li>
  <li><b>Stylize</b> effects re-render the image (halftone, dither, ASCII…).</li>
  <li><b>Light &amp; finish</b> effects adjust light and texture (bloom, god rays, blur, lens/tilt-shift blur, zoom &amp; spin blur, motion blur, grain, vignette, colour).</li>
  <li><b>Physics</b> effects are live simulations — fluid, water, jelly and particles. See <a href="#physics">Physics simulations</a>.</li>
</ul>
<p><b>Depth parallax</b> (Distort) gives a flat photo a 3D feel: put the photo below it and add a <b>depth map</b> — a greyscale image where white is near and black is far (many AI tools and phone portrait modes make these). Moving the mouse (or Auto motion, or any binding) shifts near and far parts by different amounts. Without a map, brightness is used as depth.</p>
<p>Every effect and setting is listed in the <a href="#effects">Effects reference</a>. Effects marked <span class="pill">interactive</span> react to the mouse.</p>
<div class="note"><b>Blend modes inside groups:</b> Multiply, Overlay, Difference, Soft light and Darken only change content that’s already there, so a grain or colour effect set to one of them won’t tint the empty, transparent parts of a group. Screen, Add, Lighten and Color dodge add light, so they <i>do</i> show over empty areas (a glow inside a group still glows).</div>

<h3 id="text-anim">Text animation (letter by letter)</h3>
<p>Text layers have a <b>Text animation</b> section. <b>Animate</b> splits the text into <b>letters</b>, <b>words</b> or <b>lines</b>, and each part animates in from a starting state to its normal place, one after another.</p>
<table>
  <tr><th>Setting</th><th>Meaning</th></tr>
  <tr><td>Style</td><td>Ready-made starting points: Rise, Fade, Pop, Blur in, Typewriter, Drop &amp; bounce, Spin in, Slide in. Everything can be fine-tuned afterwards.</td></tr>
  <tr><td>Starts</td><td>When the page loads, when scrolled into view, while hovered (plays backwards when the pointer leaves), on click, from code — or <b>With scroll</b>, where the scroll position itself plays the animation (fully in when the scene reaches mid-screen).</td></tr>
  <tr><td>Move from X / Y, Scale from, Rotate from, Blur from, Opacity from</td><td>How each part looks at the start. Y 40 = starts 40 px lower; Scale 0.3 = starts small.</td></tr>
  <tr><td>Duration, Stagger, Delay</td><td>How long each part takes, the gap between one part and the next, and a wait before the first.</td></tr>
  <tr><td>Order</td><td>First to last, last to first, from the centre, from the edges, or random.</td></tr>
  <tr><td>Easing, Repeat, Pause</td><td>The curve of each part’s motion (Overshoot and Bounce go past and settle). Repeat: play once, loop, or in and out, with a pause between.</td></tr>
</table>
<p><b>Replay</b> plays it again in the editor. Text animation works together with everything else: effects, masks, mouse bindings and breakpoints (shorter text on Mobile animates just the same).</p>

<h3 id="styles">Layer styles</h3>
<p>Shapes, text, images and video have a <b>Layer style</b> section with a <b>Drop shadow</b> (colour, opacity, X/Y offset, blur), <b>Outer glow</b> (colour, size, strength) and <b>Inner shadow</b> (colour, opacity, offset, blur). They follow the layer’s outline exactly — including the letters of text and the transparent parts of PNGs — and can be animated or mouse-driven like any setting (for example the shadow’s X bound to Mouse X for a moving light). Styles are drawn in 2D, so they don’t apply to 3D models or extruded layers.</p>

<h3 id="extrude">3D extrude (images, SVGs, text, shapes)</h3>
<p>Image, text and shape layers can be turned into solid 3D objects. Select the layer and switch on <b>3D extrude → Extrude in 3D</b>. It works best with <b>PNGs that have transparency</b> and with <b>SVGs</b> — the outline of the visible pixels becomes the object’s silhouette. A photo with no transparency becomes a thick slab.</p>
<table>
  <tr><th>Section</th><th>Settings</th></tr>
  <tr><td>3D extrude</td><td><b>Depth</b> (thickness in px) · <b>Bevel</b> (size of the edge, up to half the depth) · <b>Bevel shape</b>: <i>Rounded</i> or <i>Chamfer</i> (a flat 45° cut).</td></tr>
  <tr><td>3D rotation</td><td><b>Tilt X</b> and <b>Tilt Y</b> (−180° to 180°) · <b>Spin</b> (continuous turn, degrees per second) · <b>Mouse tilt</b> (how far it turns toward the cursor) · <b>Perspective</b>. The layer’s normal Rotation still turns it flat on screen, so you have all three axes.</td></tr>
  <tr><td>Surface</td><td><b>Shading</b>: Standard, Chrome, Toon, Normals or Flat colour — the same as 3D models. <b>Image on faces</b> keeps the picture on the front and back; turn it off to use a <b>Face colour</b>. <b>Sides</b>: the image’s own edge colours carried around the sides, or one <b>Side colour</b>. Metalness, Roughness and Toon steps as for models.</td></tr>
  <tr><td>3D lighting</td><td>Light direction, height and strength, Ambient, Rim light and colour, Sky and Floor reflection.</td></tr>
</table>
<p>Every one of these settings can be animated or mouse-controlled like any other — for example Tilt Y bound to <i>Mouse X</i>, or Depth growing on hover with <i>Cursor near this layer</i>.</p>
<div class="note">The 3D shape is rebuilt from the layer’s pixels when you change its content, size or font — this takes a fraction of a second, so the editor waits until you pause dragging. Very thin details (hairlines under a few pixels) are softened. Like 3D models, an extruded layer is composited flat, so it can’t pass through another layer in depth.</div>

<!-- ============================================================ -->
<h2 id="groups">Groups &amp; hierarchy</h2>
<p>Groups are folders in the layer tree, and they can be nested inside each other.</p>
<ul>
  <li><b>Create:</b> select one or more layers (Shift-click to pick several) and press <kbd>Ctrl G</kbd> (<kbd>⌘ G</kbd> on Mac), or click the folder button above the layer list.</li>
  <li><b>Ungroup:</b> <kbd>Ctrl Shift G</kbd>, or <b>Ungroup</b> in the group’s settings. The group’s opacity is passed on to its layers.</li>
  <li><b>Move layers in and out:</b> drag a layer onto the <i>middle</i> of a group’s row to put it inside; drag near a row’s top or bottom edge to place it above or below.</li>
  <li><b>Collapse / expand</b> with the small arrow beside a group.</li>
  <li><b>Group settings:</b> opacity, blend mode, mouse parallax, float and float speed — these apply to everything inside.</li>
</ul>
<div class="note"><b>The key rule:</b> an effect inside a group only changes the layers in that group. Use this to pixelate one element, blur a background while keeping text sharp, or give one part of the scene its own colour grade.</div>

<!-- ============================================================ -->
<h2 id="masks">Masks</h2>
<p>Any content layer — shape, text, image, video or 3D — can become a <b>mask</b>. A mask doesn’t draw itself; instead it acts as a stencil that clips <b>every layer above it in the same group</b>, including effects.</p>
<h3>Ways to make one</h3>
<ul>
  <li><b>Fastest:</b> select the mask layer and the layers it should clip, then press <kbd>Ctrl Alt M</kbd> (or the mask button above the layer list). They’re put in a new group and the <i>lowest</i> selected layer becomes the mask.</li>
  <li>Select a layer and set <b>Mask → Use as mask</b> in its settings.</li>
  <li>For a top-level layer, <b>Mask the layer above with this</b> does it in one click.</li>
</ul>
<h3>Mask modes</h3>
<table>
  <tr><th>Mode</th><th>What shows through</th></tr>
  <tr><td>Alpha (shape)</td><td>Wherever the mask layer has content.</td></tr>
  <tr><td>Luminance (brightness)</td><td>Bright parts of the mask show, dark parts hide — soft or blurred masks give soft fades.</td></tr>
  <tr><td>Inverted alpha (cut out)</td><td>Everything <i>except</i> the mask’s shape — cuts holes.</td></tr>
  <tr><td>Inverted luminance</td><td>Dark parts show, bright parts hide.</td></tr>
</table>
<p>In the layer list, the mask has a <b>mask</b> tag and the layers it clips show a small arrow. The mask layer’s opacity scales how strongly it masks. Hiding the mask (eye icon) switches the masking off.</p>
<div class="warn">A mask at the top level (outside any group) clips <b>everything above it in the whole scene</b>. Usually you want to group the mask with just the layers it should cut — the <kbd>Ctrl Alt M</kbd> shortcut does that for you. Ungrouping a mask group leaves the mask switched on.</div>
<h4>Ideas</h4>
<ul>
  <li>Video inside text: a text layer as the mask, a video above it.</li>
  <li>Moving gradient in a word: text mask + Mesh gradient + Liquid (see the <b>Masked type</b> template).</li>
  <li>Soft spotlight reveal: a blurred ellipse with Luminance mode, moving with mouse parallax.</li>
  <li>3D cut-out: a 3D model in Flat colour shading as the mask over a noise field.</li>
</ul>

<!-- ============================================================ -->
<h2 id="canvas">Working on the canvas</h2>
<table>
  <tr><th>Action</th><th>Result</th></tr>
  <tr><td>Click</td><td>Selects the element under the cursor. If it’s inside a group, the outermost group is selected first.</td></tr>
  <tr><td>Click again / double-click inside a selected group</td><td>Goes one level deeper. Clicking a sibling inside the same group stays at that level.</td></tr>
  <tr><td><kbd>Ctrl</kbd>/<kbd>⌘</kbd>-click</td><td>Selects the exact layer under the cursor, however deep.</td></tr>
  <tr><td><kbd>Shift</kbd>-click</td><td>Adds to / removes from the selection.</td></tr>
  <tr><td>Drag</td><td>Moves the selection (a group moves everything in it). Snaps to the frame’s centre lines; hold <kbd>Shift</kbd> to lock to one axis.</td></tr>
  <tr><td>Corner handle</td><td>Resizes: text size, shape width/height, image/video width, 3D size.</td></tr>
  <tr><td>Double-click text</td><td>Selects it and jumps to its text box.</td></tr>
  <tr><td>Arrow keys</td><td>Nudge 1 px (<kbd>Shift</kbd> for 10 px).</td></tr>
  <tr><td>Drop files</td><td>Images, videos, 3D models (.glb .gltf .obj .stl) and project files (.json) can be dropped anywhere.</td></tr>
</table>
<h3 id="links">Links &amp; layer hover</h3>
<p>Any shape, text, image, video, 3D layer or group can be a <b>link</b>: enter an address in its <b>Link</b> section (a full URL, a page like <code>/pricing</code>, or <code>#section</code>), choose <b>Open in new tab</b>, and optionally an <b>Accessible name</b> (text layers use their text). In exports a real, invisible link is laid exactly over the layer and follows it as it moves — so it’s clickable, gets the hand cursor, can be reached with the Tab key, is read by screen readers and followed by search engines.</p>
<p>For <b>hover and click states</b>, animate any setting and set <b>Starts</b> to <b>While a layer is hovered</b> (plays forward on hover, back when the pointer leaves) or <b>When a layer is clicked</b>, then pick the layer — the layer itself, or any other (hover a card to make a glow behind it grow). Text animations have the same options. On touch screens, touching counts as hovering.</p>

<h3 id="align">Align, snap, lock, copy &amp; paste</h3>
<ul>
  <li><b>Snapping:</b> while dragging, a layer’s edges and centre snap to the frame’s edges and centre and to the edges and centres of every other visible layer; a pink guide shows the line. Hold <kbd>Alt</kbd> to move freely.</li>
  <li><b>Align:</b> a single layer has <b>Align to frame</b> buttons (left, centre, right, top, middle, bottom). With several layers selected, the buttons align them to each other, and <b>Distribute</b> spaces three or more evenly.</li>
  <li><b>Lock:</b> the padlock in a layer’s row (shown on hover) makes it impossible to select or move on the canvas — handy for backgrounds. It can still be selected and edited in the layer list.</li>
  <li><b>Copy &amp; paste:</b> <kbd>Ctrl C</kbd> / <kbd>Ctrl X</kbd> / <kbd>Ctrl V</kbd> copy layers (groups, effects, masks and all, with their images, videos and fonts) — paste into the same project, another project or another browser tab. Pasting an image copied from anywhere else adds it as an image layer.</li>
  <li><b>Rename</b> by double-clicking a layer’s name.</li>
</ul>

<h3 id="rulers">Rulers, guides &amp; grid</h3>
<p>Rulers along the top and left of the canvas show design pixels. <b>Drag from a ruler</b> onto the canvas to add a guide (it snaps to whole pixels and the centre; hold <kbd>Alt</kbd> for free placement); drag a guide to move it, or drag it off the canvas or double-click it to remove it. Each layout (Desktop and every breakpoint) has its own guides. Layers snap to guides while dragging. <b>Grid</b> above the canvas turns rulers on/off, shows a grid, turns on <b>Snap to grid</b> and sets its size, and clears guides.</p>

<h3 id="timeline">Timeline</h3>
<h4>Keyframes</h4>
<p>An animated setting goes from Start to End by default. Click <b>+ Use keyframes</b> under it to give it as many values as you like: each keyframe has a <b>time</b>, a <b>value</b> and the <b>easing</b> used to arrive at it. <b>+ Keyframe at playhead</b> adds one at the current time (move the playhead by clicking the timeline ruler), <b>+ At end</b> adds one after the last. On the timeline, keyframes are diamonds: drag one to retime it, double-click a row to add one there, and drag the bar’s right edge to stretch or squeeze all of them. Repeat works as before (once, loop, back and forth); <b>Back to start → end</b> returns to two values.</p>
<p>The timeline button in the top bar opens a panel under the canvas with every setting that is <i>animated over time</i>, one row each. Each bar shows when it starts (delay) and how long it takes; faded repeats show loops, and stripes show wiggle. <b>Drag a bar</b> to change its delay, <b>drag its right edge</b> to change its duration (snaps to 0.05 s), click a row’s name to select that layer, and click or drag the ruler to jump to a moment. Animations with another start (in view, hover, click, code) are marked with a tag.</p>

<p><b>Design frame:</b> the size you set in scene settings (presets 16:9, 16:10, 21:9, 1:1, 4:5, 9:16, or custom up to 8192 px). Positions and sizes are in this frame’s pixels. When a scene is embedded in a box of a different shape, the frame is scaled to fill the box and stays centred — see <a href="#responsive">Responsive &amp; breakpoints</a> to control cropping and to design separate layouts for phones.</p>

<!-- ============================================================ -->
<h2 id="responsive">Responsive &amp; breakpoints</h2>
<p>A scene on a website is shown at many sizes: a wide desktop window, a tablet, a tall phone. Facet handles this two ways, and you can use both.</p>
<h3>1. When the shape differs</h3>
<p>In scene settings (click empty canvas), <b>When the shape differs</b> decides what happens when the embed box doesn’t match the design frame:</p>
<table>
  <tr><th>Option</th><th>Result</th></tr>
  <tr><td><b>Crop to fill</b> (cover)</td><td>The whole box is filled; parts of the frame outside it are cut off. Best for full-bleed backgrounds.</td></tr>
  <tr><td><b>Fit everything</b> (contain)</td><td>The whole frame is always visible; the background’s colour or gradient extends to fill the spare space. Best when text or a logo must never be cut.</td></tr>
</table>
<h3>2. Breakpoints</h3>
<p>The bar above the canvas has one tab per layout. <b>Desktop</b> is your main design. Click <b>+</b> to add <b>Tablet</b> (≤ 1024 px wide, 1536 × 2048 frame), <b>Mobile</b> (≤ 600 px, 1080 × 1920 frame) or a <b>Custom</b> breakpoint.</p>
<ul>
  <li>Click a tab to edit that layout. The frame takes the breakpoint’s size and is outlined in blue.</li>
  <li>Anything you change there — position, size, text, font size, visibility, effect settings, mouse bindings — is saved as an <b>override</b> for that breakpoint only. Desktop stays as it was.</li>
  <li>Overridden settings have a <b>blue label</b>, and layers with overrides show a blue dot in the layer list. <b>Double-click a blue label</b> to reset it to the inherited value.</li>
  <li>Overrides cascade downward: a change made for Tablet also applies to Mobile unless Mobile overrides it too.</li>
  <li>Hide a layer (eye icon) in a breakpoint to drop it on that size only — e.g. a heavy particle effect on phones.</li>
  <li>The breakpoint’s settings (in scene settings while it’s selected) set its name, <b>max width</b> and frame size, and let you delete it.</li>
</ul>
<p>In exports and embeds, the layout is picked from the <b>width of the element</b> the scene is in (in CSS pixels) and switches live when the window is resized or a phone is rotated. Exported HTML pages also take the breakpoint’s aspect ratio, so a phone gets a tall scene instead of a cropped wide one.</p>
<div class="note">Layers themselves are shared by all breakpoints: adding a layer adds it everywhere (hide it where it isn’t wanted), and deleting has to be done from Desktop. Undo and History record breakpoint edits with the breakpoint’s name, e.g. <i>Move “Headline” (Mobile)</i>.</div>

<!-- ============================================================ -->
<h2 id="interaction">Mouse interaction &amp; motion</h2>
<ul>
  <li><b>Mouse-reactive effects</b> (marked <span class="pill">interactive</span>) follow the cursor: glow, liquid focus, ripple, swirl, lens, mouse trail, chromatic aberration, blur focus, and more.</li>
  <li><b>Mouse parallax</b> (content layers and groups) shifts a layer as the mouse moves; negative values move it the opposite way. Give foreground and background layers different values for depth.</li>
  <li><b>Float</b> adds gentle bobbing; <b>Float speed</b> sets its pace.</li>
  <li><b>Mouse tilt</b> turns 3D models toward the cursor.</li>
  <li><b>Smoothing</b> (scene settings) controls how softly everything follows the mouse: 0 is instant, higher values glide.</li>
  <li><b>Any number setting</b> can be animated or follow the mouse, and layers can <b>spring</b> toward it — see below.</li>
</ul>
<p>Touch screens work too: the effects follow your finger. In exports, effects respond to the mouse anywhere on the page, positioned relative to the scene.</p>

<h3 id="mouse-control">Animate or mouse-control any setting</h3>
<p>Every number setting — on effects, shapes, text, images, video, 3D models, groups and the background — can be <b>animated over time</b> or <b>driven by the mouse</b>. Hover a slider and click the small <b>wave button</b> at its right, then choose <i>Animate over time</i> or <i>Follow the mouse</i>. The slider is replaced by a <b>source</b> and two values for each end; the button turns pink for animation and green for mouse control. Click it again to go back to a fixed value.</p>
<h4>Animation</h4>
<table>
  <tr><th>Setting</th><th>Meaning</th></tr>
  <tr><td>Start / End</td><td>The values it animates between.</td></tr>
  <tr><td>Duration</td><td>Seconds from start to end.</td></tr>
  <tr><td>Delay</td><td>Seconds to wait before starting (useful for staggering several layers).</td></tr>
  <tr><td>Repeat</td><td><b>Back and forth</b> (ping-pong) · <b>Loop</b> (jumps back to the start; use 0 → 360 for endless rotation) · <b>Play once</b> (intros) · <b>Wiggle</b> (smooth random motion; Duration sets how often it changes direction).</td></tr>
  <tr><td>Easing</td><td>Smooth, Linear, Ease in, Ease out, Sine, Overshoot, Elastic, Bounce, Steps. Overshoot, Elastic and Bounce briefly go past the End value on purpose.</td></tr>
</table>
<p>Animations run on the scene clock: the <b>Restart</b> button in the top bar replays them from the start, pause freezes them, and loading a scene or opening an export starts them from zero. Video export records from the start, so intros are captured. Animation and mouse control can be mixed freely — for example tilt animated over time while another setting follows the mouse.</p>
<h4>Mouse sources</h4>
<table>
  <tr><th>Source</th><th>Ends</th><th>Good for</th></tr>
  <tr><td>Mouse X</td><td>At left → At right</td><td>Sweeping a value across the screen: weight, spacing, hue, number of segments…</td></tr>
  <tr><td>Mouse Y</td><td>At top → At bottom</td><td>Vertical “sliders” — e.g. blur that increases toward the bottom.</td></tr>
  <tr><td>Mouse speed</td><td>Still → Fast</td><td>Energy: more glitch, distortion or particle force when the cursor moves fast; calm when still.</td></tr>
  <tr><td>Distance from centre</td><td>At centre → At edges</td><td>Effects that strengthen toward the edges of the frame.</td></tr>
  <tr><td>Mouse button held</td><td>Released → Held</td><td>Press-and-hold interactions: zoom in, explode particles, freeze, invert.</td></tr>
  <tr><td>Cursor near this layer</td><td>Far → Near</td><td>Shapes, text, images, video and 3D only: hover reactions — grow, brighten, rotate as the cursor approaches.</td></tr>
</table>
<p>Mouse-driven values move smoothly between the two ends (using the scene’s mouse <b>Smoothing</b>). Animations and mouse bindings are saved in projects and work in every export.</p>
<div class="note"><b>Speed settings behave like speeds.</b> Settings that set how fast something moves — Speed, Drift, Rotation speed, Hue cycle speed, Auto orbit, 3D Spin, Float speed — accumulate motion over time when they’re animated or mouse-driven. Lowering the value slows the motion down and 0 stops it where it is; it never jumps or runs backwards. For example, Starfield Drift bound to <i>Distance from centre</i> (3 → 0) makes the stars glide to a halt as the cursor moves outward.</div>
<div class="note">You can set the second value lower than the first to reverse the direction — for example, opacity 1 → 0 makes a layer fade out as the cursor approaches.</div>

<h3 id="sources">Scroll, tilt, sound &amp; triggers</h3>
<p>Besides the mouse and time, any number setting can follow:</p>
<table>
  <tr><th>Source</th><th>Ends</th><th>Notes</th></tr>
  <tr><td>Scroll (scene passing by)</td><td>Entering → Leaving</td><td>0 when the scene’s top enters the bottom of the screen, 1 when its bottom leaves the top. The way to make a section react as visitors scroll past it. In the editor, <b>scroll the mouse wheel over the canvas</b> to preview it (a bar at the right shows the position).</td></tr>
  <tr><td>Page scroll</td><td>Top of page → Bottom</td><td>Progress through the whole page — for scenes fixed behind long pages.</td></tr>
  <tr><td>Sound level · Bass · Treble (mic)</td><td>Quiet → Loud</td><td>Live microphone input. The browser asks the visitor for permission; if refused, the setting rests at its quiet value. Good for installations, talks and music pages.</td></tr>
  <tr><td>Value from code</td><td>At 0 → At 1</td><td>Driven by your page’s own code: <code>renderer.set("progress", 0.4)</code>. Give each one a name. See <a href="#api">JavaScript API</a>.</td></tr>
</table>
<h4>Starts (triggers)</h4>
<p>Settings <i>animated over time</i> have a <b>Starts</b> option: <b>When the page loads</b> (default), <b>When scrolled into view</b> (the first time the scene is mostly on screen), <b>While hovered</b> (plays forward while the pointer is over the scene and backwards when it leaves — perfect for hover states), <b>On click / tap</b> (plays from the start on every click), or <b>From code</b> (<code>renderer.trigger()</code>). Each animation keeps its own delay and duration on top of its start.</p>
<h4>Phones: tilt and the ghost cursor</h4>
<p>Phones have no hover, so in scene settings (Interaction):</p>
<ul>
  <li><b>Tilt on phones</b> (on by default): tilting the device moves the “cursor”, so mouse effects respond to how the phone is held. Android starts at once; iPhones ask for permission on the visitor’s first tap. Touching the screen still works and takes over.</li>
  <li><b>Tilt range</b> sets how far the phone must tilt (each way) to move the cursor from the centre to the edge — lower is more sensitive. <b>Drift to centre</b> sets how quickly a phone held still at an angle counts as centred again (0 = the way it was first held stays the centre). <b>Invert left/right</b> and <b>Invert up/down</b> flip the directions.</li>
  <li><b>When idle</b>: a <b>ghost cursor</b> drifts slowly around the scene when nobody has moved the pointer for 2.5 s, so mouse effects never sit still. <i>On touch screens</i> (default) or <i>always</i>; <b>Ghost speed</b> sets its pace.</li>
</ul>

<h4>Testing tilt and touch on a desktop</h4>
<p>Click <b>Phone test</b> in the bar above the canvas (or <b>Test tilt on desktop</b> in scene settings). The editor switches to your smallest breakpoint and behaves like a phone:</p>
<ul>
  <li>A <b>tilt pad</b> appears: drag the dot to tilt the virtual phone, exactly as the device’s sensor would (the readout shows the angle and where the cursor lands). Let go and it stays tilted, then drifts back to centre like a real phone held still. <b>Hand sway</b> moves it on its own, like a phone held in a hand.</li>
  <li>The mouse acts like a <b>finger</b>: hovering does nothing; pressing and dragging on the canvas is a touch. After 2.5 s without touching, the ghost cursor (if on) takes over.</li>
  <li>Layers can’t be moved on the canvas during the test. Click <b>Phone test</b> again (or the ✕) to go back.</li>
</ul>
<p>To test the real thing, open the exported page on your phone. In Chrome on a desktop you can also use DevTools → ⋮ → More tools → <b>Sensors</b> → Orientation to send real orientation events to an exported page.</p>

<h3 id="spring">Spring follow</h3>
<p>Content layers, 3D models and groups have <b>Spring follow</b> (in their Motion section). The layer chases the cursor on a physical spring: it overshoots, swings back and settles.</p>
<ul>
  <li><b>Spring follow</b> — how far it travels toward the cursor (1 = all the way to it).</li>
  <li><b>Stiffness</b> — how hard the spring pulls; higher is snappier.</li>
  <li><b>Damping</b> — how quickly the motion calms down; lower values bounce and wobble more.</li>
</ul>
<p>Spring follow, parallax and float add together, so a layer can bob gently, shift with parallax and spring toward the cursor all at once.</p>

<h3 id="falloff">Radius &amp; falloff</h3>
<p>Every effect setting that has a radius — mouse glow, liquid focus, wavy-line bend, ripple, swirl, lens bulge, mouse trail, bloom, blur and its focus, and all physics brushes — has a matching <b>Falloff</b>. Falloff 0 gives a hard edge; 1 fades smoothly all the way from the centre to the radius.</p>

<!-- ============================================================ -->
<h2 id="gravity">Gravity lens</h2>
<p><b>Gravity lens</b> (in Distort) bends everything below it the way mass bends light. It’s built so the physics only “breaks” when you push it: at its defaults it’s a soft, physically correct lens that magnifies and curves what’s behind it, and only the extreme settings produce a black hole.</p>
<table>
  <tr><th>Push this…</th><th>…and you get</th></tr>
  <tr><td><b>Softness</b> high</td><td>A smooth magnifying bulge, like looking through a drop of water — the mass is spread out (like a galaxy).</td></tr>
  <tr><td><b>Softness</b> toward 0</td><td>A point mass: background shapes stretch into thin arcs and an <b>Einstein ring</b> forms at the Radius.</td></tr>
  <tr><td><b>Strength</b> above 1 or below 0</td><td>More bending than real mass would give; negative values are exotic negative mass that pushes light outward and shrinks what’s behind it.</td></tr>
  <tr><td><b>Event horizon</b> above 0</td><td>The centre collapses into a black hole with a shadow surrounded by a thin photon ring. <b>Horizon colour</b> sets the shadow’s colour (black is physical). A black hole is a point mass, so Softness is hidden.</td></tr>
  <tr><td><b>Accretion disk</b> above 0</td><td>A glowing orbiting disk; light from its far side is bent over and under the centre (the <i>Interstellar</i> look). The Disk settings appear, including camera tilt and mouse orbit.</td></tr>
  <tr><td><b>Colour split</b></td><td>Unphysical rainbow fringes — real gravity bends all colours equally.</td></tr>
</table>
<p><b>Follow mouse</b> is on by default, so the lens travels with the cursor; set it to 0 and use X and Y to place it. <b>Reach</b> and <b>Falloff</b> limit how far the bending extends (30 = physical; lower keeps it local). Like every number setting, all of these can be bound to the mouse — Strength bound to <i>Mouse button held</i> makes pressing add mass. Without a horizon or disk the lens is a cheap formula; with either, every pixel is ray-traced, so lower <b>Quality</b> if it runs slowly.</p>
<div class="note">Scenes made with the earlier <b>Black hole</b> effect open as a Gravity lens set up identically.</div>

<h2 id="physics">Physics simulations</h2>
<p>The Physics effects are live simulations running on the graphics card. Unlike other effects they <b>remember previous frames</b>, so what the mouse does leaves a lasting, physical result. They work like any other effect: they act on everything below them in their group, have opacity and blend modes, and all their number settings can be mouse-controlled.</p>
<table>
  <tr><th>Effect</th><th>What it simulates</th><th>Tips</th></tr>
  <tr><td><b>Fluid</b></td><td>An incompressible fluid (advection, pressure, vorticity). Moving the mouse pushes the fluid, which drags the image along and leaves ink.</td><td><b>Swirl</b> adds curling eddies. <b>Self-stirring</b> keeps it moving without a mouse. Choose <i>Ink only</i> for smoke on top of a sharp image, or <i>Distort only</i> for invisible liquid.</td></tr>
  <tr><td><b>Water surface</b></td><td>The wave equation: ripples travel, interfere and bounce off the frame edges. The surface refracts the image below and catches highlights.</td><td><b>Wave persistence</b> sets how long waves last. <b>Raindrops</b> adds random drops on its own. Hold the mouse button for bigger waves.</td></tr>
  <tr><td><b>Jelly</b></td><td>A spring-mass sheet. Each point is pulled back to rest by a spring and connected to its neighbours, so pushes travel outward as wobbling waves.</td><td><b>Drag along</b> smears with the cursor; <b>Push away</b> / <b>Pull in</b> act while moving or holding the button. Lower <b>Damping</b> = more wobble; raise <b>Spread</b> for bigger waves.</td></tr>
  <tr><td><b>Particles</b></td><td>Up to 262,144 particles with forces, friction, springs, flow fields, gravity and bouncing.</td><td><b>Reassemble image</b> turns everything below into particles that scatter and spring back — put text on a dark background below it and raise <b>Skip dark pixels</b> to make only the text into particles. <b>Return to shape</b> sets how hard they’re pulled home and <b>Overshoot</b> how much they swing past before settling (0 = straight home). <b>Swarm</b> drifts through a flow field; <b>Gravity</b> rains and bounces — <b>Bounce</b> is how much particles rebound off the floor and walls there. Settings that don’t apply to the chosen Behaviour are hidden. With <b>Hide original</b> off, particles draw on top of the image instead of replacing it. With it on, <b>Behind particles</b> chooses what fills the gaps: <i>Transparent</i> (layers outside the group still show) or a <i>Colour</i>. Particles are spaced evenly to match the frame’s shape, and invisible ones are skipped, so they’re cheaper than before.</td></tr>
</table>
<ul>
  <li>Everything with a radius has a <b>Falloff</b>; force-type settings work well bound to <b>Mouse speed</b> or <b>Mouse button held</b>.</li>
  <li>Simulations restart when the scene changes size (for example when an embed is resized or switches breakpoint) and when they’re first shown. They freeze while the scene is paused.</li>
  <li>They need floating-point rendering, which nearly all current devices support. If a device can’t run them, the effect is skipped and the rest of the scene still shows.</li>
  <li>Physics effects are heavier than ordinary effects. Particle counts above 65,536 are best kept for desktop.</li>
</ul>

<!-- ============================================================ -->
<h2 id="transform">Transform</h2>
<p><b>Transform</b> (in Distort) moves, scales, rotates, skews and tilts in 3D <i>everything below it in its group</i>. Put it at the top of a group to transform just that group — or at the top level to transform the whole scene. Combine it with animation for motion: pop-in intros (Scale 0.4 → 1, Play once, Overshoot), endless spins (Rotation 0 → 360, Loop, Linear), card flips (Tilt Y, Back and forth, Sine) or tilt-with-the-mouse.</p>
<table>
  <tr><th>Group</th><th>Settings</th></tr>
  <tr><td>Move</td><td>Move X / Y as a fraction of the frame (positive = right / down).</td></tr>
  <tr><td>Scale &amp; rotate</td><td>Scale, Scale X / Y (negative flips), Rotation, Skew X / Y.</td></tr>
  <tr><td>3D tilt</td><td>Tilt X (flip up/down), Tilt Y (turn like a door), Perspective, and whether the back side shows when it faces away.</td></tr>
  <tr><td>Anchor &amp; edges</td><td>The point it scales and rotates around, how edges are handled (below), and Keep background still.</td></tr>
</table>
<h4>No more cropped backgrounds</h4>
<p>Normally everything is only drawn inside the frame, so scaling down, rotating or moving the result would reveal empty edges. Transform avoids that in three ways:</p>
<table>
  <tr><th>Option</th><th>What it does</th><th>Best for</th></tr>
  <tr><td><b>Edges: Extend</b> (default)</td><td>Facet works out how much area outside the frame this transform can pull into view — over the <i>full range</i> of any animated or mouse-driven settings, overshooting easings included — and draws the layers below that far. Because it’s worked out once from the settings rather than every frame, the extra canvas never changes size mid-animation, so grain, blur and other effects stay perfectly steady; it’s aligned to the frame’s pixel grid too. Gradients, fills, noise, starfields and the background simply continue; shapes and text placed off-canvas slide into view. With no transform it costs nothing. <b>Max extra canvas</b> limits how far it goes (1 = one frame width on each side); very large areas are drawn at a lower resolution to save memory.</td><td>Backgrounds, fills, patterns — anything procedural.</td></tr>
  <tr><td><b>Keep background still</b> (on by default)</td><td>When the Transform is at the top level, the scene’s Background layer stays put and only the layers above it move.</td><td>Moving or zooming content over a fixed backdrop.</td></tr>
  <tr><td><b>Edges: Zoom to cover</b></td><td>Scales up just enough that no edge ever shows, like video stabilisation; the zoom updates as the transform animates.</td><td>Images and video, which really do end at their edges.</td></tr>
  <tr><td>Repeat · Mirror · Stretch edges</td><td>Fill outside the content by tiling, mirroring or smearing the edge pixels.</td><td>Patterns and deliberate effects.</td></tr>
</table>
<p>A strong 3D tilt can still show a dark area: that’s the tilted plane’s horizon — the picture genuinely ends there. With Keep background still on, the background shows through instead.</p>
<div class="note">Fills (mesh gradient, noise, starfield…) cover the whole frame, so transforming a group with a fill inside moves a full-frame rectangle. Clip the group’s content with a mask first — the <b>Card flip</b> template shows how: a masked “Card content” group inside a “Card” group that holds the Transform.</div>

<h4>Motion blur</h4>
<p>Put a <b>Motion blur</b> effect (Light &amp; finish) above anything that moves. Its modes:</p>
<table>
  <tr><th>Mode</th><th>What it blurs</th></tr>
  <tr><td><b>Real motion</b> (default)</td><td>Blends recent frames, so only things that actually move get blurred, along their real path — animated transforms, spinning 3D, video, particles. Still things stay sharp. <b>Amount</b> sets how long the trail lasts.</td></tr>
  <tr><td><b>Mouse movement</b></td><td>Blurs everything below along the direction the mouse is moving, more the faster it moves; sharp when the mouse is still.</td></tr>
  <tr><td><b>Directional</b></td><td>A fixed streak with a Length and Angle — the classic “speed” look.</td></tr>
  <tr><td><b>Zoom</b> / <b>Spin</b></td><td>Radial zoom streaks or rotational blur around a centre (which can follow the mouse), with a <b>Sharp radius</b> and <b>Falloff</b> to keep the middle crisp.</td></tr>
</table>
<p>Like other effects it only affects layers below it in its group — put it inside a group with an animated Transform to blur just that element. Real motion restarts its trail when switched on, and its trail lives within the frame (not in a Transform’s extra canvas).</p>

<!-- ============================================================ -->
<h2 id="history">Undo &amp; history</h2>
<ul>
  <li><b>Undo</b> (<kbd>Ctrl Z</kbd>) and <b>Redo</b> (<kbd>Ctrl Shift Z</kbd> or <kbd>Ctrl Y</kbd>) are the arrow buttons in the top bar. Hover them to see exactly what they’ll undo or redo, e.g. “Undo: Change Strength on “Gravity lens””.</li>
  <li>The <b>History</b> button (clock icon, next to them) lists every step with a description. Click any step to jump straight back to it — or forward again. Greyed steps are ones you’ve undone; they can be redone until you make a new change.</li>
  <li>Up to 200 steps are kept. Dragging a slider or moving an element counts as one step.</li>
  <li>Switching to a template or opening a project is also a step, so you can undo it and get your previous scene back — including its images, video and models.</li>
  <li>History lasts for the current session; it isn’t saved in project files.</li>
</ul>

<!-- ============================================================ -->
<h2 id="saving">Saving, library &amp; versions</h2>
<ul>
  <li><b>Autosave:</b> your work is saved in the browser as you go and restored the next time you open Facet. It belongs to <b>that browser on that computer</b> and that copy of <code>facet.html</code>; clearing browser data erases it.</li>
  <li><b>Undo / Redo</b> keeps the last 100 steps for the current session.</li>
</ul>
<h3>The Library</h3>
<p><b>Library</b> in the top bar shows your saved projects as a grid of thumbnails, in two places:</p>
<table>
  <tr><th>Tab</th><th>What it is</th></tr>
  <tr><td><b>In this browser</b></td><td>Quick “temp” saves kept inside the browser. Instant, nothing to set up — but tied to this browser on this computer and lost if site data is cleared. Each can be downloaded as a file.</td></tr>
  <tr><td><b>Folder</b></td><td>A real folder on your computer that you choose once (<b>Choose folder…</b>). Projects are saved into it as <code>name.facet.json</code> with a <code>name.facet.jpg</code> thumbnail beside it, and every Facet project in the folder (including downloaded <code>…-project.json</code> files) is listed with its thumbnail. Put the folder in Dropbox, Google Drive or iCloud to sync and back it up. After restarting the browser it may ask you to <b>Allow access</b> again.</td></tr>
  <tr><td><b>Versions of this project</b></td><td>Named snapshots (<b>Save a version now…</b>) and automatic backups taken every 5 minutes while you work (the newest 10 are kept). <b>Restore</b> loads one — and Ctrl+Z takes you back. Versions are kept in this browser.</td></tr>
</table>
<p><b>Save</b> (<kbd>Ctrl S</kbd>) saves straight back to wherever the project came from (browser or folder); the first time it asks where. The Save menu also has <b>Save to library…</b>, <b>Save a version…</b> and <b>Download project file</b> (<code>name-project.json</code> with everything embedded — still the way to send a project to someone).</p>
<div class="note">Saving into a folder uses a browser feature available in <b>Chrome, Edge and Opera</b> on desktop. In Firefox and Safari use “In this browser” and download project files.</div>

<h3 id="presets">Presets &amp; palette</h3>
<p><b>Presets</b> (under the Add buttons) are reusable pieces: select layers, a group or an effect stack and click <b>Save selection as preset</b> (or the star above the layer list). Each preset keeps its images, fonts, animations, links and effects and gets a thumbnail; <b>Insert</b> adds it to any project. A few built-in presets are included (Hover button, Neon title, Blur-in headline). Presets live in this browser — <b>Export presets…</b> saves them all to a file, <b>Import presets…</b> loads them elsewhere.</p>
<p>The <b>Palette</b> (scene settings) holds shared colours. Every colour setting has a small swatch button: pick a palette colour to <b>link</b> it (the field then shows the colour’s name). Changing the palette colour recolours every linked setting at once — handy for brand colours or trying a different theme. The count next to each colour shows how many settings use it; removing a colour leaves those settings with its last value. <b>Add this colour to the palette</b> creates a palette colour from any setting.</p>

<h3 id="preview">Live preview</h3>
<p><b>Preview</b> opens the scene in its own browser tab at real size, exactly as an export would play it, and it <b>updates live</b> as you edit. Its toolbar switches between <b>Fill window</b>, <b>Phone</b> (390×844), <b>Tablet</b>, <b>Laptop</b> and <b>Desktop</b> sizes — each picks the matching breakpoint — shows the size, active layout and frame rate, and <b>In a page</b> places the scene between page content so you can scroll to try scroll-driven settings and in-view triggers. Allow pop-ups for Facet if the tab doesn’t open.</p>

<!-- ============================================================ -->
<h2 id="export">Exporting</h2>
<table>
  <tr><th>Export</th><th>You get</th><th>Use it for</th></tr>
  <tr><td><b>Web page</b></td><td>One self-contained <code>.html</code></td><td>Opening locally, sharing a preview, or uploading as a full-screen page. No dependencies, no network requests.</td></tr>
  <tr><td><b>Embed on your own site</b></td><td><code>name-scene.json</code> + <code>facet-runtime.js</code></td><td>Putting the scene inside an existing website. See <a href="#embed">Embedding</a>.</td></tr>
  <tr><td><b>Image</b></td><td><code>.png</code> at 0.5×, 1× or 2×</td><td>A still of the current frame, including the current mouse position and video frame.</td></tr>
  <tr><td><b>Video</b></td><td><code>.mp4</code> (or <code>.webm</code>)</td><td>Social posts, presentations. Records in real time for the length you choose (30 or 60 fps). Move your mouse over the preview while recording to capture interactions.</td></tr>
  <tr><td><b>Project file</b></td><td><code>name-project.json</code></td><td>Reopening and editing later in Facet.</td></tr>
</table>
<p>By default, images, videos, models and uploaded fonts are embedded in exports, so large media means large files. Files no layer uses any more are left out automatically. For websites, export media as separate files instead — see below.</p>

<h3 id="fallback">Fallback still</h3>
<p>The Export dialog starts with a <b>Fallback still</b>: a JPG of each layout (Desktop and every breakpoint), captured from the canvas exactly as it is when you press <b>Capture</b> — time, mouse position and all, so set up the moment you want first. Layouts you haven’t captured are captured automatically when you export. The still is used:</p>
<ul>
  <li><b>While loading</b> — it shows instantly, then the live scene fades in over it once its media has loaded (after at most 4 s).</li>
  <li><b>Without WebGL2</b> — old devices, blocked graphics or when something fails, visitors still see the design.</li>
  <li><b>For reduced motion</b> — visitors who turn on “reduce motion” see the still (or, if you choose <i>Show the live scene, not moving</i>, the scene frozen but still reacting to the mouse).</li>
</ul>
<p>Stills are saved with the project and can be included in the scene or as separate files like any other media (below). Untick <b>Include</b> to leave them out.</p>
<div class="note"><b>Loading only when needed:</b> embedded scenes (<code>data-facet-src</code> and <code>data-facet-scene</code>) now start only when they come within about a screen of being visible, so a scene far down a page costs nothing until the visitor scrolls toward it — the fallback still holds its place. Add <code>data-facet-lazy="false"</code> to start immediately.</div>

<h3 id="media-export">Media: embed, separate file or link — per file</h3>
<p>The <b>Media</b> box lists every image, video, model, font, effect input and fallback still the scene uses, with its size. Choose for <b>each file</b>:</p>
<ul>
  <li><b>Embed</b> — inside the scene file. Simplest, works offline and from disk, but everything downloads before anything shows. Fine for small files such as an SVG logo or a font.</li>
  <li><b>Separate file</b> — written to a <code>media/</code> folder next to the scene and loaded on demand, in parallel with the page. Best for photos and video.</li>
  <li><b>Link (URL)</b> — loaded from an address where the file already is (your CDN, an asset host, a CMS); nothing is included in the download. A link left empty falls back to embedding.</li>
</ul>
<p><b>All separate</b> and <b>All embedded</b> set every file at once. Choices are remembered with the project. As soon as one file is separate, the Web page and Embed downloads become a <code>.zip</code> with the <code>media/</code> folder.</p>
<ul>
  <li><b>Responsive image sizes</b> (on by default) saves each image as <b>WebP</b> in several widths — 480, 960, 1600, 2560 px — up to the largest it is ever shown at (×2 for sharp screens, across every breakpoint). The player loads the smallest version that is still sharp at the size it is drawn on that screen, and swaps to a sharper one if the window grows. It never steps down to a blurrier one.</li>
  <li>SVGs stay as SVGs (they’re sharp at any size). GIFs and models are copied as they are.</li>
  <li>Videos are copied as they are, plus a small <b>poster frame</b> that shows until the video can play.</li>
  <li><b>Media folder URL</b>: if the <code>media/</code> folder will be uploaded somewhere other than next to the page, put that address here and every file is linked from it.</li>
</ul>
<table>
  <tr><th>Export</th><th>With separate files you get</th></tr>
  <tr><td>Web page</td><td><code>name.zip</code> → <code>name/index.html</code> + <code>name/media/…</code>. Upload the folder as it is.</td></tr>
  <tr><td>Embed on your own site</td><td><code>name-scene.zip</code> → <code>name-scene.json</code> + <code>media/…</code>. Unzip both into the same folder; media is found <i>next to the .json</i>, wherever the page that embeds it lives. The runtime is downloaded separately as before.</td></tr>
</table>
<div class="note"><b>A different video for phones:</b> select the video layer in the Mobile breakpoint and use <b>Replace video…</b> to choose a smaller, lighter file. Each screen only downloads the video its layout uses. The same works for images.</div>
<div class="warn"><b>Two rules for separate media.</b> (1) It needs a web server — browsers block separate media on pages opened from disk (<code>file://</code>). Test locally with any simple server, or keep <i>Inside the file</i> for offline sharing. (2) Files on a <i>different domain</i> than the page must allow cross-origin use (the server sends <code>Access-Control-Allow-Origin</code>). WebGL refuses to draw pixels it isn’t allowed to read. Most CDNs, S3, Cloudflare R2 and Bunny have a setting for it; files on the same site as the page need nothing.</div>

<!-- ============================================================ -->
<h2 id="embed">Embedding on a website</h2>
<p>Export → <b>Embed on your own site</b> gives you two files:</p>
<ul>
  <li><b><code>name-scene.json</code></b> — the scene: layers, settings and embedded media. This is the only file that changes from project to project.</li>
  <li><b><code>facet-runtime.js</code></b> — the player. It’s the same for every scene, so a site only needs one copy.</li>
</ul>
<p>Upload both next to your page and add:</p>
<pre><code>&lt;div data-facet-src="name-scene.json" style="width:100%;height:100vh"&gt;&lt;/div&gt;
&lt;script src="facet-runtime.js" defer&gt;&lt;/script&gt;</code></pre>
<ul>
  <li>The scene fills the element. Size it with CSS; if the element has no height, it takes the design frame’s aspect ratio.</li>
  <li>Several scenes can share one page and one runtime — just add more elements with their own <code>data-facet-src</code>.</li>
  <li>Scenes pause automatically when scrolled off-screen, adapt to resizing and to high-resolution screens.</li>
  <li>For visitors who have “reduce motion” switched on in their system settings, the animation stays still (mouse effects still work).</li>
  <li>Builders like Webflow or Framer: upload the two files (or host them anywhere) and paste the snippet into an embed/custom-code block.</li>
  <li>Exported with <a href="#media-export">separate media</a>? Put the <code>media/</code> folder next to the <code>.json</code>. To load media from somewhere else, add <code>data-facet-assets="https://cdn.example.com/hero/"</code> to the element — relative media paths then resolve against that address.</li>
</ul>

<h3>Without a web server</h3>
<p>Browsers won’t let a page opened straight from disk (<code>file://</code>) read a separate <code>.json</code> file. On a real website this doesn’t matter. For local testing, or when you can’t host a separate file, use <b>Copy no-server snippet</b>, which puts the scene inside the HTML:</p>
<pre><code>&lt;div data-facet-scene="#name-scene" style="width:100%;height:100vh"&gt;&lt;/div&gt;
&lt;script type="application/json" id="name-scene"&gt;{ …scene… }&lt;/script&gt;
&lt;script src="facet-runtime.js" defer&gt;&lt;/script&gt;</code></pre>

<h3 id="api">JavaScript API</h3>
<p>Loading <code>facet-runtime.js</code> defines a global <code>Facet</code>. Elements with <code>data-facet-src</code> or <code>data-facet-scene</code> are mounted automatically; for full control use:</p>
<table>
  <tr><th>Call</th><th>Does</th></tr>
  <tr><td><code>Facet.load(el, url, options?)</code></td><td>Fetches a scene <code>.json</code> and mounts it in <code>el</code> (element or CSS selector). Returns a Promise of the renderer.</td></tr>
  <tr><td><code>Facet.mount(el, scene, options?)</code></td><td>Mounts a scene object you already have. Returns the renderer (or <code>null</code> if WebGL2 is unavailable).</td></tr>
  <tr><td><code>Facet.scan()</code></td><td>Mounts any new <code>data-facet-*</code> elements added after page load.</td></tr>
  <tr><td><code>renderer.pause()</code> / <code>renderer.play()</code></td><td>Stop / continue the animation (videos included).</td></tr>
  <tr><td><code>renderer.restart()</code></td><td>Back to the start, videos included.</td></tr>
  <tr><td><code>renderer.time</code></td><td>Current animation time in seconds (readable and writable).</td></tr>
  <tr><td><code>renderer.set(layer, key, value)</code></td><td>Overrides a setting from your code: <code>r.set('Headline', 'opacity', 0.5)</code>, <code>r.set('Particles', 'p.force', 2)</code> (<code>p.</code> + an effect setting). <code>layer</code> is the layer’s name (or id); pass <code>null</code> as the value to hand control back to the scene.</td></tr>
  <tr><td><code>renderer.set(name, value)</code></td><td>Feeds a “Value from code” binding (0–1): <code>r.set('progress', 0.4)</code> — e.g. from your own scroll library or a slider.</td></tr>
  <tr><td><code>renderer.get(layer, key)</code></td><td>The setting’s current value (after animation and the mouse).</td></tr>
  <tr><td><code>renderer.trigger()</code></td><td>Starts animations set to start “From code” (again, if they already played). <code>r.trigger('click')</code> acts like a click.</td></tr>
  <tr><td><code>renderer.layers()</code></td><td>The names of all layers.</td></tr>
  <tr><td><code>renderer.destroy()</code></td><td>Stops it and frees the GPU resources.</td></tr>
</table>
<p>The element fires a <code>facet:ready</code> event (with the renderer as <code>event.detail</code>) when the scene starts, and keeps it as <code>element.__facet</code>:</p>
<pre><code>document.querySelector('#hero').addEventListener('facet:ready', function (e) {
  var r = e.detail;
  window.addEventListener('scroll', function () { r.set('progress', Math.min(1, scrollY / 800)); });
  document.querySelector('#play').onclick = function () { r.trigger(); };
});</code></pre>
<h4>Options</h4>
<table>
  <tr><th>Option</th><th>Default</th><th>Meaning</th></tr>
  <tr><td><code>autoplay</code></td><td class="num">true</td><td>Start animating immediately.</td></tr>
  <tr><td><code>interactive</code></td><td class="num">true</td><td>React to the mouse / touch.</td></tr>
  <tr><td><code>dprCap</code></td><td class="num">2</td><td>Maximum device pixel ratio. Lower it (e.g. 1.5) for speed on high-DPI screens.</td></tr>
  <tr><td><code>quality</code></td><td class="num">1</td><td>Render-resolution multiplier (0.5 = half resolution, much faster).</td></tr>
  <tr><td><code>pauseOffscreen</code></td><td class="num">true</td><td>Pause while the element isn’t visible.</td></tr>
  <tr><td><code>reducedMotion</code></td><td class="num">true</td><td>Respect the visitor’s “reduce motion” setting.</td></tr>
  <tr><td><code>lazy</code></td><td class="num">false</td><td>With <code>Facet.load</code>: wait until the element is near the screen. (Automatic for <code>data-facet-*</code> elements.)</td></tr>
  <tr><td><code>assetBase</code></td><td class="num">—</td><td>Address that relative media paths (<code>media/…</code>) resolve against. Defaults to the scene <code>.json</code>’s location (with <code>load</code>) or the page.</td></tr>
</table>
<pre><code>Facet.load('#hero', '/media/hero-scene.json', { quality: 0.75 })
  .then(function (r) { if (r) document.querySelector('#stop').onclick = function () { r.pause(); }; });</code></pre>
<p>If WebGL2 is unavailable, the element keeps the scene’s background colour, so pages still look reasonable.</p>

<h2 id="sharing">Sharing files</h2>
<ul>
  <li><b>Email blocks <code>.js</code> attachments</b> (Gmail, Outlook and most company mail filters) because of the file type, whatever is inside — it isn’t something Facet can change. Send the <code>.json</code> scene freely, and share <code>facet-runtime.js</code> through a link (Drive, Dropbox, WeTransfer, a Git repository), or let the recipient download it themselves from the Export dialog in their own copy of Facet.</li>
  <li><b>Previews for anyone:</b> the Web page export (<code>.html</code>) opens in any browser. Some company mail filters also hold back HTML attachments; a shared link always works.</li>
  <li><b>Collaborating:</b> send <code>facet.html</code> together with a project file; the other person opens Facet and uses <b>Open</b>.</li>
</ul>

<h2 id="performance">Performance &amp; file size</h2>
<p>The top bar shows three colour-coded meters, updated as you work: <b>Phone</b> and <b>Desktop</b> render load, and the <b>download size</b>. Click them for the full breakdown.</p>
<table>
  <tr><th>Meter</th><th>Unit</th><th>Green · Yellow · Orange · Red</th></tr>
  <tr><td>Render load</td><td>% of what a mid-range device draws smoothly at 60 fps. The work is counted in <b>texture reads per pixel per frame</b> (reads/px), estimated from each layer’s shader: 100 % ≈ 60 reads/px on a phone (780×1688 px), 50 on a tablet, 160 on a desktop at 2560×1440.</td><td>≤ 60 % · ≤ 85 % · ≤ 100 % · above</td></tr>
  <tr><td>Download size</td><td>What a visitor downloads before the scene shows: player + scene + embedded media (separate files load afterwards).</td><td>&lt; 1 MB · &lt; 2.5 MB · &lt; 5 MB · above</td></tr>
</table>
<p>The Performance panel lists the load of every layout and the heaviest layers (click one to select it); heavy layers also get a coloured percentage in the layer list. Each layout has a <b>Render quality</b> (Full, High 85 %, Balanced 70 %, Light 50 % resolution) — e.g. Balanced on Mobile cuts its load roughly in half. <b>Lower the resolution automatically</b> (on by default) makes exported scenes drop to a lower resolution when a visitor’s device falls below ~45 fps, and step back up when it’s smooth again. The numbers are estimates; the fps counter and a real phone have the final word.</p>
<p><b>Smaller player:</b> exported pages include only the effects and 3D code the scene uses, without comments — typically 100–130 KB instead of ~245 KB (around a third of that once a web server compresses it). The separate <code>facet-runtime.js</code> is the full player by default so one copy can play every scene; tick <b>Only what this scene uses</b> to trim it.</p>
<ul>
  <li>Each effect is a full-screen pass, and every group or mask adds one more. A dozen layers is fine on most machines; watch the fps counter in the top bar.</li>
  <li><b>Bloom</b> and <b>Blur</b> with large radii, <b>Liquid</b>, and the <b>Physics</b> simulations are the heaviest effects. Fluid and Water run at reduced internal resolution already; for Particles, choose the smallest count that looks right.</li>
  <li>Settings bound to the mouse on text, shapes and images re-draw that layer while the mouse moves — cheap for a few layers, noticeable with dozens of large text layers.</li>
  <li>Very detailed 3D models (hundreds of thousands of triangles) and large videos (4K) cost the most — 1080p video is plenty for backgrounds.</li>
  <li>For embeds on slow devices, pass <code>quality: 0.75</code> or <code>dprCap: 1.5</code> (see <a href="#api">options</a>).</li>
  <li>The editor preview runs at your screen’s resolution; exports adapt to the size they’re shown at.</li>
</ul>

<h2 id="troubleshooting">Troubleshooting</h2>
<table>
  <tr><th>Problem</th><th>Fix</th></tr>
  <tr><td>“WebGL2 isn’t available”</td><td>Update the browser and turn on hardware acceleration (Chrome/Edge: Settings → System → “Use graphics acceleration when available”), then restart the browser.</td></tr>
  <tr><td>Embedded scene doesn’t appear</td><td>Open the browser console (F12). If it mentions <code>file://</code>, the page was opened from disk: test through a web server or use the no-server snippet. Check that the <code>.json</code> path in <code>data-facet-src</code> is right and the element has a size.</td></tr>
  <tr><td>Can’t email the export</td><td>See <a href="#sharing">Sharing files</a> — <code>.js</code> attachments are blocked by type.</td></tr>
  <tr><td>Video doesn’t show</td><td>Convert it to MP4 (H.264) or WebM.</td></tr>
  <tr><td>3D model error message</td><td>Read the message under the model’s Source setting. Usually: re-export without Draco compression, or as a single <code>.glb</code>.</td></tr>
  <tr><td>Model looks dark or too shiny</td><td>Raise Light strength and Ambient, lower Metalness, or switch off File materials.</td></tr>
  <tr><td>Text looks different on another computer</td><td>Upload the font file instead of using a built-in font.</td></tr>
  <tr><td>“Too big to autosave”</td><td>The browser ran out of storage space for this project. Use Save regularly; your project file is unaffected.</td></tr>
  <tr><td>Work disappeared after reopening</td><td>Autosave is per browser and per copy of <code>facet.html</code>. Open your saved project file.</td></tr>
  <tr><td>Images or videos missing after exporting with separate media</td><td>Open the browser console (F12). On <code>file://</code>: use a web server. A CORS error: the media host must send <code>Access-Control-Allow-Origin</code>, or move the files to the same site as the page. A 404: the <code>media/</code> folder isn’t next to the <code>.json</code> (or set <code>data-facet-assets</code>).</td></tr>
  <tr><td>Video export is empty or choppy</td><td>Recording is real time: close other heavy tabs, choose a smaller size, or 30 fps.</td></tr>
</table>

<h2 id="project-format">Project file format</h2>
<p>For developers: project and scene files are plain JSON.</p>
<pre><code>{
  "version": 1,
  "name": "My scene",
  "width": 1920, "height": 1080,          // design frame in px
  "mouseSmoothing": 0.85,
  "assets": { "a1b2c3": "data:image/png;base64,…" },   // embedded media by id
  "fonts":  [ { "family": "My Font", "asset": "d4e5f6" } ],
  "layers": [                               // bottom first
    { "id": "…", "type": "background", "params": { "mode": 1, "c1": "#101014", "c2": "#26213d", "angle": -60 } },
    { "id": "…", "type": "group", "name": "Masked word", "opacity": 1, "blend": 0, "children": [
        { "id": "…", "type": "text", "text": "HELLO", "x": 0.5, "y": 0.5, "size": 300, "mask": true, "maskMode": "alpha", … },
        { "id": "…", "type": "effect", "effect": "meshGradient", "params": { … }, "opacity": 1, "blend": 0 }
    ] }
  ]
}</code></pre>
<ul>
  <li>Layer <code>type</code>: <code>background</code>, <code>shape</code>, <code>text</code>, <code>image</code>, <code>video</code>, <code>model</code>, <code>effect</code>, <code>group</code>.</li>
  <li><code>x</code> and <code>y</code> are fractions of the frame (0–1, centre-anchored); sizes are in frame pixels.</li>
  <li><code>mods</code> holds mouse bindings: <code>{ "opacity": { "src": "near", "from": 0.2, "to": 1 }, "p.force": { "src": "speed", "from": 0.5, "to": 3 } }</code>. Keys are layer properties, or <code>p.</code> + an effect/background setting; <code>src</code> is <code>time</code>, <code>x</code>, <code>y</code>, <code>speed</code>, <code>dist</code>, <code>press</code> or <code>near</code>. Time bindings also have <code>dur</code>, <code>delay</code> (seconds), <code>ease</code> (<code>inout</code>, <code>linear</code>, <code>in</code>, <code>out</code>, <code>sine</code>, <code>back</code>, <code>elastic</code>, <code>bounce</code>, <code>steps</code>) and <code>loop</code> (<code>pingpong</code>, <code>loop</code>, <code>once</code>, <code>wiggle</code>).</li>
  <li><code>assets</code> values can be an embedded <code>data:</code> URL, a link (<code>"media/logo.svg"</code>, <code>"https://…"</code>; relative links resolve against the scene <code>.json</code>), or a responsive set: <code>{ "src": "media/hero.webp", "w": 3000, "h": 2000, "sizes": [ { "w": 960, "src": "media/hero-960w.webp" }, … ] }</code>. Videos may add <code>"poster"</code>.</li>
  <li><code>mods</code> sources also include <code>scroll</code>, <code>page</code>, <code>audio</code>, <code>bass</code>, <code>treble</code> and <code>var</code> (with <code>name</code>); time bindings may have <code>trigger</code>: <code>view</code>, <code>hover</code>, <code>click</code> or <code>manual</code>.</li>
  <li>Scene: <code>tilt</code> (false to turn off), <code>tiltRange</code> (degrees, default 25), <code>tiltRecenter</code> (0–1), <code>tiltInvertX</code>, <code>tiltInvertY</code>, <code>idle</code> (<code>off</code>, <code>touch</code>, <code>always</code>), <code>idleSpeed</code>, <code>fallback</code> (<code>{ "base": assetId, "&lt;breakpointId&gt;": assetId }</code>), <code>reducedMotion</code> (<code>image</code> or <code>live</code>).</li>
  <li>Time bindings may have <code>keys</code>: <code>[{ "t": 0, "v": 0 }, { "t": 1.2, "v": 1, "ease": "back" }, …]</code> (seconds after the delay), and <code>trigger</code> <code>layerHover</code> / <code>layerClick</code> with <code>target</code> (a layer id). Layers may have <code>link</code>: <code>{ "url", "newTab", "label" }</code>; text <code>fontWidth</code> and <code>taTarget</code>.</li>
  <li>Scene: <code>palette</code> (<code>[{ id, name, color }]</code>; colours may be <code>"@id"</code>), <code>quality</code> and per-breakpoint <code>quality</code>, <code>adaptive</code> (false to keep full resolution), <code>guides</code>, <code>grid</code>, <code>uid</code>.</li>
  <li>Layers: <code>locked</code>; styles <code>shadow</code>/<code>shadowColor</code>/<code>shadowOpacity</code>/<code>shadowX</code>/<code>shadowY</code>/<code>shadowBlur</code>, <code>glow</code>/<code>glowColor</code>/<code>glowSize</code>/<code>glowStrength</code>, <code>inner</code>/<code>innerColor</code>/<code>innerOpacity</code>/<code>innerX</code>/<code>innerY</code>/<code>innerBlur</code>. Shapes: <code>fillType</code> (<code>solid</code>, <code>linear</code>, <code>radial</code>, <code>none</code>), <code>color2</code>, <code>gradAngle</code>, <code>gradSize</code>, <code>strokeWidth</code>, <code>strokeColor</code>; vector shapes have <code>shape: "path"</code>, <code>paths</code> (<code>[{ d, fill, m?, rule?, stroke?, sw? }]</code>), <code>vb</code> and <code>ownColors</code>. Text: <code>textAnim</code> (<code>letters</code>, <code>words</code>, <code>lines</code>) and <code>taY</code>, <code>taX</code>, <code>taScale</code>, <code>taRot</code>, <code>taBlur</code>, <code>taOpacity</code>, <code>taDur</code>, <code>taStagger</code>, <code>taDelay</code>, <code>taOrder</code>, <code>taEase</code>, <code>taTrigger</code>, <code>taRepeat</code>, <code>taHold</code>.</li>
  <li><code>fit</code> (scene): <code>cover</code> or <code>contain</code>. <code>breakpoints</code> (scene): <code>[{ "id", "name", "maxWidth", "width", "height", "fit" }]</code>. Per-layer overrides live in <code>bp</code>, keyed by breakpoint id: <code>"bp": { "m1": { "size": 160, "y": 0.4, "p.count": 4096 } }</code>.</li>
  <li>Extrude keys on image/text/shape layers: <code>extrude</code>, <code>depth</code>, <code>bevel</code>, <code>bevelShape</code> (<code>round</code>/<code>chamfer</code>), <code>rotX</code>, <code>rotY</code>, <code>spin</code>, <code>mouseTilt</code>, <code>fov</code>, <code>shading</code>, <code>faceImage</code>, <code>sideMode</code>, <code>sideColor</code>, <code>matColor</code>, plus the lighting keys shared with models.</li>
  <li><code>follow</code>, <code>springStiffness</code> and <code>springDamping</code> are the spring-follow settings.</li>
  <li><code>blend</code> is an index into: Normal, Multiply, Screen, Overlay, Add, Difference, Soft light, Darken, Lighten, Color dodge.</li>
  <li>Effect keys and their <code>params</code> are listed in the <a href="#effects">Effects reference</a>.</li>
</ul>
<p style="color:var(--muted);margin-top:40px">Facet runs entirely on your machine. Exports have no dependencies and make no network requests of their own.</p>
</main>
