<script id="facet-runtime">
/*!
 * Facet runtime — renders Facet scenes with WebGL2.
 * Self-contained, no dependencies, no network calls. Yours to host anywhere.
 */
(function (global) {
  'use strict';
  if (global.Facet && global.Facet.__runtime) return;

  /* ------------------------------------------------------------------ */
  /*  Shader building blocks                                             */
  /* ------------------------------------------------------------------ */

  var IDV = [0, 0, 1, 1]; // a target that covers exactly the frame
  var BLENDS = ['Normal', 'Multiply', 'Screen', 'Overlay', 'Add', 'Difference', 'Soft light', 'Darken', 'Lighten', 'Color dodge'];

  var VERT = '#version 300 es\n' +
    'uniform vec4 uView;\n' +
    'out vec2 vUv;\n' +
    'void main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); vUv = uView.xy + p * uView.zw; gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }';

  var HEADER = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 vUv;',
    'out vec4 outColor;',
    'uniform sampler2D uTex;',
    'uniform vec2 uRes;',
    'uniform float uTime;',
    'uniform vec2 uMouse;',
    'uniform vec2 uMouseVel;',
    'uniform float uScale;',
    'uniform float uOpacity;',
    'uniform int uBlend;',
    'uniform int uFilter;',
    'uniform float uPress;',
    'uniform float uDt;',
    'uniform vec2 uFrameRes;',
    '#define PI 3.14159265359',
    'uniform vec4 uSrcView;',
    'vec4 T(vec2 uv){ return texture(uTex, (uv - uSrcView.xy) / uSrcView.zw); }',
    'vec4 viewTex(sampler2D s, vec4 v, vec2 uv){ vec2 t = (uv - v.xy) / v.zw; return (t.x < 0.0 || t.y < 0.0 || t.x > 1.0 || t.y > 1.0) ? vec4(0.0) : texture(s, t); }',
    'vec2 aspect(){ return vec2(uRes.x / uRes.y, 1.0); }',
    'float luma(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }',
    '// 1 inside the radius, 0 outside; falloff 0 = hard edge, 1 = soft all the way to the centre.',
    'float falloff(float d, float r, float f){ return 1.0 - smoothstep(r * (1.0 - clamp(f, 0.0, 0.999)), r + 1e-4, d); }',
    'mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }',
    'float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }',
    'vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }',
    'vec4 mod289(vec4 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }',
    'vec4 permute(vec4 x){ return mod289(((x * 34.0) + 1.0) * x); }',
    'vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }',
    'float snoise(vec3 v){',
    '  const vec2 C = vec2(1.0/6.0, 1.0/3.0); const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);',
    '  vec3 i = floor(v + dot(v, C.yyy)); vec3 x0 = v - i + dot(i, C.xxx);',
    '  vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g; vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);',
    '  vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy;',
    '  i = mod289(i);',
    '  vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));',
    '  float n_ = 0.142857142857; vec3 ns = n_ * D.wyz - D.xzx;',
    '  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);',
    '  vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_);',
    '  vec4 x = x_ * ns.x + ns.yyyy; vec4 y = y_ * ns.x + ns.yyyy; vec4 h = 1.0 - abs(x) - abs(y);',
    '  vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw);',
    '  vec4 s0 = floor(b0) * 2.0 + 1.0; vec4 s1 = floor(b1) * 2.0 + 1.0; vec4 sh = -step(h, vec4(0.0));',
    '  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;',
    '  vec3 p0 = vec3(a0.xy, h.x); vec3 p1 = vec3(a0.zw, h.y); vec3 p2 = vec3(a1.xy, h.z); vec3 p3 = vec3(a1.zw, h.w);',
    '  vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));',
    '  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;',
    '  vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0); m = m * m;',
    '  return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));',
    '}',
    'float fbm(vec3 p){ float f = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ f += a * snoise(p); p = p * 2.02 + vec3(1.7, 9.2, 3.1); a *= 0.5; } return f; }',
    'vec3 rgb2hsv(vec3 c){ vec4 K = vec4(0.0, -1.0/3.0, 2.0/3.0, -1.0); vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g)); vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r)); float d = q.x - min(q.w, q.y); float e = 1.0e-10; return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x); }',
    'vec3 hsv2rgb(vec3 c){ vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0); vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www); return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y); }',
    'vec3 grad3(vec3 a, vec3 b, vec3 c, float t){ return t < 0.5 ? mix(a, b, t * 2.0) : mix(b, c, t * 2.0 - 1.0); }',
    ''
  ].join('\n');

  var MAIN = [
    'vec3 blendFn(vec3 b, vec3 s, int m){',
    '  if (m == 1) return b * s;',
    '  if (m == 2) return 1.0 - (1.0 - b) * (1.0 - s);',
    '  if (m == 3) return mix(2.0 * b * s, 1.0 - 2.0 * (1.0 - b) * (1.0 - s), step(0.5, b));',
    '  if (m == 4) return b + s;',
    '  if (m == 5) return abs(b - s);',
    '  if (m == 6) return mix(2.0 * b * s + b * b * (1.0 - 2.0 * s), sqrt(b) * (2.0 * s - 1.0) + 2.0 * b * (1.0 - s), step(0.5, s));',
    '  if (m == 7) return min(b, s);',
    '  if (m == 8) return max(b, s);',
    '  if (m == 9) return b / max(1.0 - s, 0.001);',
    '  return s;',
    '}',
    'void main(){',
    '  vec4 base = T(vUv);',
    '  vec4 src = clamp(effect(vUv), 0.0, 1.0);',
    '  vec3 B = clamp(blendFn(base.rgb, src.rgb, uBlend), 0.0, 1.0);',
    '  float oa; vec3 pc;',
    '  if (uFilter == 1) {',
    '    oa = mix(base.a, src.a, uOpacity);',
    '    pc = mix(base.rgb * base.a, B * src.a, uOpacity);',
    '  } else {',
    '    float a = src.a * uOpacity;',
    '    vec3 cs = mix(src.rgb, B, base.a);',
    '    // Light-adding blends (screen, add, lighten, dodge): where there is nothing below, black adds nothing,',
    '    // so the layer only contributes its light instead of becoming an opaque dark sheet.',
    '    // Modifier blends (multiply, overlay, difference, soft light, darken) only change what is already there.',
    '    if (uBlend == 1 || uBlend == 3 || uBlend == 5 || uBlend == 6 || uBlend == 7) a *= base.a;',
    '    if (uBlend == 2 || uBlend == 4 || uBlend == 8 || uBlend == 9) {',
    '      float lum = max(max(src.r, src.g), src.b);',
    '      a = mix(a * lum, a, base.a);',
    '      cs = mix(src.rgb / max(lum, 1e-4), B, base.a);',
    '    }',
    '    oa = a + base.a * (1.0 - a);',
    '    pc = a * cs + base.a * (1.0 - a) * base.rgb;',
    '  }',
    '  outColor = vec4(oa > 0.0 ? pc / oa : vec3(0.0), oa);',
    '}'
  ].join('\n');

  /* ------------------------------------------------------------------ */
  /*  Effect library                                                     */
  /* ------------------------------------------------------------------ */

  function R(k, label, min, max, def, step) { return { k: k, label: label, type: 'range', min: min, max: max, def: def, step: step || +((max - min) / 100).toPrecision(2) }; }
  function C(k, label, def) { return { k: k, label: label, type: 'color', def: def }; }
  function B(k, label, def) { return { k: k, label: label, type: 'bool', def: !!def }; }
  function S(k, label, options, def) { return { k: k, label: label, type: 'select', options: options, def: def }; }

  var EFFECTS = {
    /* ---- Fills: generate their own image ---- */
    //@fx:meshGradient
    meshGradient: {
      name: 'Mesh gradient', cat: 'Fill', desc: 'Four soft colour blobs drifting and warping into each other.', mouse: true,
      params: [C('c1', 'Colour 1', '#5b2bff'), C('c2', 'Colour 2', '#ff4f9a'), C('c3', 'Colour 3', '#00d1c1'), C('c4', 'Colour 4', '#0b0820'),
        R('scale', 'Scale', 0.2, 3, 1), R('speed', 'Speed', 0, 2, 0.35), R('warp', 'Warp', 0, 2, 0.7), R('mouse', 'Mouse pull', 0, 1, 0.3)],
      glsl: [
        'vec4 effect(vec2 uv){',
        '  vec2 asp = aspect();',
        '  vec2 p = (uv - 0.5) * asp / p_scale;',
        '  float t = uTime * p_speed;',
        '  p += p_warp * 0.35 * vec2(snoise(vec3(p * 0.9, t * 0.4)), snoise(vec3(p * 0.9 + 7.3, t * 0.4)));',
        '  vec2 m = (uMouse - 0.5) * asp * p_mouse;',
        '  vec2 a = vec2(sin(t * 0.7) * 0.55 * asp.x, cos(t * 0.5) * 0.35) + m;',
        '  vec2 b = vec2(cos(t * 0.6 + 1.0) * 0.55 * asp.x, sin(t * 0.8 + 2.0) * 0.35);',
        '  vec2 c = vec2(sin(t * 0.4 + 4.0) * 0.55 * asp.x, cos(t * 0.7 + 3.0) * 0.35) - m * 0.5;',
        '  vec2 d = vec2(cos(t * 0.5 + 5.0) * 0.55 * asp.x, sin(t * 0.6 + 1.5) * 0.35);',
        '  float wa = exp(-dot(p - a, p - a) * 4.0), wb = exp(-dot(p - b, p - b) * 4.0);',
        '  float wc = exp(-dot(p - c, p - c) * 4.0), wd = exp(-dot(p - d, p - d) * 2.5) + 0.05;',
        '  vec3 col = (p_c1 * wa + p_c2 * wb + p_c3 * wc + p_c4 * wd) / (wa + wb + wc + wd);',
        '  return vec4(col, 1.0);',
        '}'].join('\n')
    },
  //@end
    //@fx:noiseFill
    noiseFill: {
      name: 'Noise field', cat: 'Fill', desc: 'Flowing fractal noise mapped onto a three-colour ramp.',
      params: [C('c1', 'Shadows', '#0d0221'), C('c2', 'Mids', '#ff3c00'), C('c3', 'Highlights', '#ffd36b'),
        R('scale', 'Scale', 0.2, 4, 1.2), R('speed', 'Speed', 0, 2, 0.3), R('contrast', 'Contrast', 0.2, 3, 1.4)],
      glsl: [
        'vec4 effect(vec2 uv){',
        '  float n = fbm(vec3((uv - 0.5) * aspect() * p_scale * 2.5, uTime * p_speed * 0.25)) * 0.5 + 0.5;',
        '  n = clamp((n - 0.5) * p_contrast + 0.5, 0.0, 1.0);',
        '  return vec4(grad3(p_c1, p_c2, p_c3, n), 1.0);',
        '}'].join('\n')
    },
  //@end
    //@fx:lines
    lines: {
      name: 'Wavy lines', cat: 'Fill', desc: 'Evenly spaced lines that ripple and drift.', mouse: true,
      blend: 0,
      params: [C('color', 'Colour', '#ffffff'), R('count', 'Count', 2, 80, 18, 1), R('thickness', 'Thickness (px)', 0.5, 20, 2),
        R('amplitude', 'Amplitude', 0, 2, 0.6), R('speed', 'Speed', 0, 3, 0.6), R('angle', 'Angle', -90, 90, 0, 1), R('mouse', 'Mouse bend', 0, 1, 0.4), R('radius', 'Bend radius', 0.05, 1.5, 0.4), R('falloff', 'Falloff', 0, 1, 1)],
      glsl: [
        'vec4 effect(vec2 uv){',
        '  vec2 p = rot(p_angle * PI / 180.0) * ((uv - 0.5) * aspect());',
        '  vec2 m = rot(p_angle * PI / 180.0) * ((uMouse - 0.5) * aspect());',
        '  float bend = p_mouse * 0.12 * falloff(length(p - m), p_radius, p_falloff);',
        '  float y = p.y + p_amplitude * 0.06 * (sin(p.x * 4.0 + uTime * p_speed) + snoise(vec3(p.x * 1.5, p.y * 0.6, uTime * p_speed * 0.3))) + bend;',
        '  float d = abs(fract(y * p_count) - 0.5) / p_count;',
        '  float px = 1.0 / uRes.y;',
        '  float w = p_thickness * uScale * px * 0.5;',
        '  return vec4(p_color, 1.0 - smoothstep(w, w + px * 1.25, d));',
        '}'].join('\n')
    },
  //@end

        if (x.bp) Object.keys(x.bp).forEach(function (k) { if (x.bp[k].asset && remap[x.bp[k].asset]) x.bp[k].asset = remap[x.bp[k].asset]; });

  }

    var nowUi = performance.now(), dtUi = Math.min(0.1, (nowUi - lastUi) / 1000); lastUi = nowUi;
    stepPhoneTest(dtUi);
    updateSelBox();
    updatePlayhead();
    var sl = layerById(selectedId);
    if (sl && sl.type === 'model') {
      var ms = R.modelStatus(sl), key = sl.id + ms.status + (ms.hasMaterials ? 1 : 0);
      if (key !== lastModelState) { lastModelState = key; if (!document.activeElement || !document.getElementById('inspector').contains(document.activeElement)) renderInspector(); }
    }
    requestAnimationFrame(uiLoop);
  }

  /* ------------------------------------------------------------------ */
  /*  Boot                                                               */
  /* ------------------------------------------------------------------ */
  async function boot() {
    $('#logo').innerHTML = IC.logo;
    master = scene = await loadInitial();
    try {
      R = new F.Renderer($('#view'), scene, { reducedMotion: false, dprCap: 2, breakpoint: null, adaptive: false });
    } catch (e) {
      document.body.appendChild(el('div', { class: 'fatal' }, el('div', null,
        el('h2', { text: 'WebGL2 isn’t available' }),
        'Facet needs WebGL2 with hardware acceleration. Try a current version of Chrome, Edge, Firefox or Safari, and check that hardware acceleration is switched on in the browser settings.')));
      return;
    }
    window.__facet = { get scene() { return scene; }, get master() { return master; }, get activeBp() { return activeBp; }, switchBp: function (id) { switchBp(id); }, addBreakpoint: addBreakpoint, renderer: R, loadScene: loadScene, templates: TEMPLATES, normalize: normalize, pageHTML: function () { return pageHTML(cleanScene()); }, pageHTMLWith: function (s, full) { return pageHTML(s, full); }, runtimeFile: runtimeFile, docsHTML: docsHTML, sceneJSON: function () { return JSON.stringify(cleanScene()); }, externalizeMedia: function (o) { var sc = cleanScene(); delete sc.exportLinks; return externalizeMedia(sc, o || {}).then(function (r) { return { scene: r.scene, files: r.files.map(function (f) { return [f.name, f.data.size || f.data.length]; }) }; }); }, inlineSnippet: function (n) { return inlineSnippet(n || 'scene', cleanScene()); } };
    bindTop();
    bindStage();
    bindKeys();
    bindClipboard();
    $('#perfBtn').onclick = openPerf;
    $('#previewBtn').onclick = openPreview;
    $('#tlBtn').innerHTML = IC.timeline; $('#tlBtn').onclick = function () { toggleTimeline(); };
    setPlaying(true);
    renderAll();
    resetHistory();
    uiLoop();
    setInterval(function () { $('#fps').textContent = Math.round(R.fps) + ' fps'; }, 500);
  }
  boot().catch(function (err) {
    // Something in the saved state (or this browser) stopped Facet from starting. Never leave a blank screen:
    // explain, offer the autosave as a file, and offer a clean start (the autosave is kept as a backup).
    console.error('[Facet] could not start:', err);
    var raw = null; try { raw = localStorage.getItem(STORE_KEY); } catch (e) { /* ignore */ }
    document.body.appendChild(el('div', { class: 'fatal' }, el('div', null,
      el('h2', { text: 'Facet couldn’t start' }),
      el('p', { text: 'Error: ' + (err && err.message || err) }),
      raw ? el('p', { text: 'Your last session is still saved. Download it to keep it safe, then start fresh — you can open the file again from the Library.' }) : null,
      el('div', { class: 'btn-row', style: 'margin-top:12px' },
        raw ? el('button', { class: 'btn', text: 'Download last session', onclick: function () { download('facet-last-session-project.json', raw, 'application/json'); } }) : null,
        el('button', { class: 'btn primary', text: 'Start fresh', onclick: function () { try { if (raw) localStorage.setItem(STORE_KEY + ':backup', raw); localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ } location.reload(); } })))));
  });
})();

</script>
